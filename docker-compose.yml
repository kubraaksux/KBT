version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: kbt-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=kbt
    networks:
      - kbt-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kbt-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=kbt
      - MODEL_NAME=meta-llama/Llama-3.2-1B
    depends_on:
      - mongodb
    networks:
      - kbt-network
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kbt-frontend
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - kbt-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongodb_data:

networks:
  kbt-network:
    driver: bridge
